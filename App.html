/**
 * XSS-Safe HTML Escaper
 */
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

/**
 * Date Preset Range Calculator
 */
function getDatePresetRange(preset) {
  var now = new Date();
  var pad = function(n) { return (n < 10 ? '0' : '') + n; };
  var formatDateStr = function(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  };

  var todayStr = formatDateStr(now);

  if (preset === 'TODAY') {
    return { start: todayStr, end: todayStr };
  } else if (preset === 'YESTERDAY') {
    var yest = new Date(now.getTime() - 86400000);
    var yStr = formatDateStr(yest);
    return { start: yStr, end: yStr };
  } else if (preset === 'WEEK') {
    var weekAgo = new Date(now.getTime() - (6 * 86400000));
    return { start: formatDateStr(weekAgo), end: todayStr };
  } else if (preset === 'MONTH') {
    var firstOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
    return { start: formatDateStr(firstOfMonth), end: todayStr };
  } else if (preset === 'ALL') {
    return { start: '', end: '' };
  }
  return { start: todayStr, end: todayStr };
}

/**
 * Live Ground Staff Stopwatch Controller
 */
function startShiftStopwatch(initialSeconds) {
  stopShiftStopwatch();
  shiftElapsedSeconds = initialSeconds || 0;
  updateShiftStopwatchDisplay();
  shiftStopwatchTimer = setInterval(function() {
    shiftElapsedSeconds++;
    updateShiftStopwatchDisplay();
  }, 1000);
}

function stopShiftStopwatch() {
  if (shiftStopwatchTimer) {
    clearInterval(shiftStopwatchTimer);
    shiftStopwatchTimer = null;
  }
}

function updateShiftStopwatchDisplay() {
  var el = document.getElementById('tracker-stopwatch');
  if (!el) return;
  var hrs = Math.floor(shiftElapsedSeconds / 3600);
  var mins = Math.floor((shiftElapsedSeconds % 3600) / 60);
  var secs = shiftElapsedSeconds % 60;
  var pad = function(n) { return (n < 10 ? '0' : '') + n; };
  el.textContent = pad(hrs) + ':' + pad(mins) + ':' + pad(secs);
}

/**
 * Safe helper to visually format store names by replacing underscores with spaces
 */
function formatStoreName(name) {
  if (!name) return 'Mother Hub';
  return String(name).replace(/_/g, ' ');
}

/**
 * Color-coded auto-dismissing Toast notification (Zero Emojis)
 */
function showToast(message, type) {
  var toastType = type || 'info';
  var toast = document.getElementById('toast');
  if (!toast) return;

  if (toastTimer) clearTimeout(toastTimer);

  toast.textContent = message;
  toast.className = 'toast show ' + toastType;

  toastTimer = setTimeout(function() {
    toast.className = 'toast';
    toast.textContent = '';
  }, 3500);
}

/**
 * Hybrid Identity Storage Helpers:
 * Checks localStorage.getItem('attendance_user_email') and syncs with attend_user_email
 */
function getPersistedUserEmail() {
  return (localStorage.getItem('attendance_user_email') || localStorage.getItem('attend_user_email') || '').trim().toLowerCase();
}

function setPersistedUserEmail(email) {
  if (!email) return;
  var norm = String(email).trim().toLowerCase();
  localStorage.setItem('attendance_user_email', norm);
  localStorage.setItem('attend_user_email', norm);
}

function clearPersistedUserEmail() {
  localStorage.removeItem('attendance_user_email');
  localStorage.removeItem('attend_user_email');
}

function getCurrentUserEmail() {
  var user = AppState.getState().currentUser;
  if (user && user.email) return String(user.email).trim().toLowerCase();
  return getPersistedUserEmail();
}

/**
 * Silent Real-Time Multi-Portal Sync Engine
 * Operates completely in the background without any blinking lights or UI clutter.
 * Automatically synchronizes backend data every 8 seconds, on window focus,
 * and immediately after any action (punch in/out, staff creation, store updates).
 */
var LiveSync = (function() {
  var syncIntervalMs = 8000; // 8 seconds for fast, near-instant multi-user sync
  var syncTimer = null;
  var isSyncInFlight = false;

  function performSync(onComplete) {
    if (isSyncInFlight) {
      if (onComplete) onComplete();
      return;
    }

    var state = AppState.getState();
    if (!state.isInitialized || !state.currentUser) {
      if (onComplete) onComplete();
      return;
    }

    // Pause polling when browser tab is hidden to save mobile battery/bandwidth
    if (document.hidden && !onComplete) {
      return;
    }

    isSyncInFlight = true;
    var role = state.currentRole;
    var callerEmail = getCurrentUserEmail();

    if (role === 'SUPER_ADMIN') {
      google.script.run
        .withSuccessHandler(function(resp) {
          isSyncInFlight = false;
          if (resp && resp.success) {
            cachedSuperAdminData.kpis = resp.kpis;
            cachedSuperAdminData.stores = resp.stores || [];
            cachedSuperAdminData.logs = resp.logs || [];
            cachedSuperAdminData.allUsers = resp.allUsers || [];
            renderSuperAdminUI();
          }
          if (onComplete) onComplete();
        })
        .withFailureHandler(function(err) {
          isSyncInFlight = false;
          if (onComplete) onComplete();
        })
        .getSuperAdminDashboardData(callerEmail);

    } else if (role === 'REGIONAL_MANAGER') {
      var filterStoreId = cachedRegionalManagerData.selectedStoreId || 'ALL';
      var startDate = cachedRegionalManagerData.dateAttendance.startDate || '';
      var endDate = cachedRegionalManagerData.dateAttendance.endDate || '';
      var sortKey = cachedRegionalManagerData.dateAttendance.sortKey || 'TIME';
      var sortOrder = cachedRegionalManagerData.dateAttendance.sortOrder || 'DESC';

      google.script.run
        .withSuccessHandler(function(resp) {
          isSyncInFlight = false;
          if (resp && resp.success) {
            cachedRegionalManagerData.assignedStores = resp.assignedStores || cachedRegionalManagerData.assignedStores;
            cachedRegionalManagerData.kpis = resp.kpis;
            if (resp.dateAttendance && resp.dateAttendance.dateGroups) {
              cachedRegionalManagerData.dateAttendance.dateGroups = resp.dateAttendance.dateGroups;
            }
            cachedRegionalManagerData.roster = resp.roster || cachedRegionalManagerData.roster;
            renderRegionalManagerUI();
          }
          if (onComplete) onComplete();
        })
        .withFailureHandler(function(err) {
          isSyncInFlight = false;
          if (onComplete) onComplete();
        })
        .getRegionalManagerDashboardData({
          callerEmail: callerEmail,
          startDate: startDate,
          endDate: endDate,
          sortKey: sortKey,
          sortOrder: sortOrder,
          filterStoreId: filterStoreId
        });

    } else if (role === 'STORE_ADMIN') {
      google.script.run
        .withSuccessHandler(function(resp) {
          isSyncInFlight = false;
          if (resp && resp.success) {
            cachedStoreAdminData.store = resp.store;
            cachedStoreAdminData.kpis = resp.kpis;
            cachedStoreAdminData.logs = resp.logs || [];
            cachedStoreAdminData.roster = resp.roster || [];
            renderStoreAdminUI();
          }
          if (onComplete) onComplete();
        })
        .withFailureHandler(function(err) {
          isSyncInFlight = false;
          if (onComplete) onComplete();
        })
        .getStoreAdminDashboardData(callerEmail);

    } else if (role === 'USER') {
      google.script.run
        .withSuccessHandler(function(resp) {
          isSyncInFlight = false;
          if (resp && resp.success) {
            AppState.setState(function(s) {
              s.stores = resp.stores || [];
              s.recentLogs = resp.recentLogs || [];
            });
            renderUserUI(AppState.getState());
          }
          if (onComplete) onComplete();
        })
        .withFailureHandler(function(err) {
          isSyncInFlight = false;
          if (onComplete) onComplete();
        })
        .getUserDashboardData(callerEmail);
    } else {
      isSyncInFlight = false;
      if (onComplete) onComplete();
    }
  }

  function start() {
    stop();
    syncTimer = setInterval(function() {
      performSync();
    }, syncIntervalMs);
  }

  function stop() {
    if (syncTimer) {
      clearInterval(syncTimer);
      syncTimer = null;
    }
    isSyncInFlight = false;
  }

  function triggerImmediate() {
    performSync();
  }

  // Instant refresh when user returns to this tab or unlocks their phone
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden) {
      performSync();
    }
  });

  window.addEventListener('focus', function() {
    performSync();
  });

  return {
    start: start,
    stop: stop,
    triggerImmediate: triggerImmediate,
    syncNow: performSync
  };
})();

/**
 * Bootstrap on DOM ready
 */
document.addEventListener('DOMContentLoaded', function() {
  initApp();
});

function initApp() {
  if (window.GeoTracker && window.GeoTracker.detectDeviceType) {
    AppState.setState(function(s) {
      s.geo.deviceType = GeoTracker.detectDeviceType();
    });
  }

  // Subscribe state changes
  AppState.subscribe(function(state) {
    if (state.currentRole === 'USER') {
      renderUserUI(state);
    }
  });

  // Zero-friction boot: pass saved email hint if available
  var savedEmail = getPersistedUserEmail();
  reloadSessionData(savedEmail);
}

/**
 * Top Bar Refresh button handler: routes refresh action based on active role
 */
function handleRefreshCurrentView() {
  var rBtn = document.getElementById('btn-header-refresh');
  var origText = rBtn ? rBtn.textContent : 'Refresh';
  if (rBtn) {
    rBtn.classList.add('btn-loading');
    rBtn.disabled = true;
    rBtn.textContent = 'Refreshing...';
  }

  function restoreRefreshBtn() {
    if (rBtn) {
      rBtn.classList.remove('btn-loading');
      rBtn.disabled = false;
      rBtn.textContent = origText || 'Refresh';
    }
  }

  LiveSync.syncNow(restoreRefreshBtn);
}

/**
 * Reloads session data from GAS backend
 */
function reloadSessionData(clientEmail, onComplete) {
  showLoadingView(true);
  hideAllDashboards();

  var emailToUse = (clientEmail !== undefined && clientEmail !== null && String(clientEmail).trim())
    ? String(clientEmail).trim().toLowerCase()
    : getPersistedUserEmail();

  google.script.run
    .withSuccessHandler(function(resp) {
      if (onComplete) onComplete();
      handleInitialData(resp);
    })
    .withFailureHandler(function(err) {
      if (onComplete) onComplete();
      showLoadingView(false);
      showToast("Session Error: " + (err.message || err), "error");
      var viewAuth = document.getElementById('view-auth-prompt');
      if (viewAuth) viewAuth.classList.remove('hidden');
    })
    .getInitialSessionData(emailToUse);
}

/**
 * Shows/hides the main initial loading card
 */
function showLoadingView(show) {
  var loader = document.getElementById('view-loading');
  var headerTitle = document.getElementById('header-store-name');
  if (loader) {
    if (show) {
      loader.classList.remove('hidden');
      if (headerTitle) headerTitle.textContent = "Connecting";
    } else {

}

function hideAllDashboards() {
  var viewAuth = document.getElementById('view-auth-prompt');
  var viewUser = document.getElementById('view-user-dashboard');
  var viewStoreAdmin = document.getElementById('view-store-admin-dashboard');
  var viewSuperAdmin = document.getElementById('view-super-admin-dashboard');
  var viewRegionalManager = document.getElementById('view-regional-manager-dashboard');
  var viewDenied = document.getElementById('view-access-denied');

  if (viewAuth) viewAuth.classList.add('hidden');
  if (viewUser) viewUser.classList.add('hidden');
  if (viewStoreAdmin) viewStoreAdmin.classList.add('hidden');
  if (viewSuperAdmin) viewSuperAdmin.classList.add('hidden');
  if (viewRegionalManager) viewRegionalManager.classList.add('hidden');
  if (viewDenied) viewDenied.classList.add('hidden');
}

/**
 * Switch from Error Card back to Auth Prompt
 */
function showAuthPromptManual() {
  LiveSync.stop();
  clearPersistedUserEmail();
  hideAllDashboards();
  var headerTitle = document.getElementById('header-store-name');
  if (headerTitle) headerTitle.textContent = "Workplace Sign In";
  var viewAuth = document.getElementById('view-auth-prompt');
  if (viewAuth) viewAuth.classList.remove('hidden');
  var input = document.getElementById('manual-auth-email');
  if (input) {
    input.value = '';
    input.focus();
  }
  var statusMsg = document.getElementById('auth-status-msg');
  if (statusMsg) {
    statusMsg.className = 'auth-status-msg hidden';
    statusMsg.textContent = '';
  }
}

/**
 * Manual Email Sign-In handler (With instant verification against Users sheet)
 */
function handleManualAuthSubmit(e) {
  if (e && e.preventDefault) e.preventDefault();
  var input = document.getElementById('manual-auth-email');
  if (!input || !input.value) return;

  var email = input.value.trim().toLowerCase();
  if (!email || email.indexOf('@') === -1) {
    showToast("Please enter a valid workplace corporate email.", "error");
    return;
  }

  var btn = document.getElementById('btn-manual-auth');
  var origText = btn ? btn.textContent : '';
  if (btn) {
    btn.disabled = true;
    btn.classList.add('btn-loading');
    btn.textContent = "Verifying email...";
  }

  var statusMsg = document.getElementById('auth-status-msg');
  if (statusMsg) {
    statusMsg.className = 'auth-status-msg hidden';
    statusMsg.textContent = '';
  }

  showLoadingView(true);
  hideAllDashboards();

  google.script.run
    .withSuccessHandler(function(resp) {
      if (btn) {
        btn.disabled = false;
        btn.classList.remove('btn-loading');
        btn.textContent = origText || "Continue to Dashboard";
      }
      showLoadingView(false);

      if (resp && (resp.notRegistered || resp.unauthorized)) {
        clearPersistedUserEmail();
        hideAllDashboards();
        var viewDenied = document.getElementById('view-access-denied');
        if (viewDenied) viewDenied.classList.remove('hidden');
        var emailBox = document.getElementById('access-denied-email');
        if (emailBox) emailBox.textContent = resp.email || email;
        var msgBox = document.getElementById('access-denied-msg');
        if (msgBox) msgBox.textContent = resp.message || "Error: Email is not registered in the database.";
        return;
      }

      if (resp && resp.success) {
        var userEmail = resp.user ? resp.user.email.toLowerCase().trim() : email;
        setPersistedUserEmail(userEmail);
        handleInitialData(resp);
        showToast("Signed in as " + userEmail, "success");
      } else {
        var viewAuth = document.getElementById('view-auth-prompt');
        if (viewAuth) viewAuth.classList.remove('hidden');
        var msg = (resp && resp.message) || "Authentication failed. Please verify email.";
        if (statusMsg) {
          statusMsg.textContent = msg;
          statusMsg.className = 'auth-status-msg show';
        }
        showToast(msg, "error");
      }
    })
    .withFailureHandler(function(err) {
      showLoadingView(false);
      if (btn) {
        btn.disabled = false;
        btn.classList.remove('btn-loading');
        btn.textContent = origText || "Continue to Dashboard";
      }
      var viewAuth = document.getElementById('view-auth-prompt');
      if (viewAuth) viewAuth.classList.remove('hidden');
      var errText = "Verification error: " + (err.message || err);
      if (statusMsg) {
        statusMsg.textContent = errText;
        statusMsg.className = 'auth-status-msg show';
      }
      showToast(errText, "error");
    })
    .getInitialSessionData(email);
}

/**
 * Main Router: Mounts strictly 1 of the 3 role interfaces
 */
function handleInitialData(resp) {
  showLoadingView(false);

  // If unauthorized / not registered in database -> Show Dedicated Error UI
  if (resp && (resp.notRegistered || resp.unauthorized)) {
    LiveSync.stop();
    clearPersistedUserEmail();
    hideAllDashboards();
    var headerTitle = document.getElementById('header-store-name');
    if (headerTitle) headerTitle.textContent = "Access Denied";
    var viewDenied = document.getElementById('view-access-denied');
    if (viewDenied) viewDenied.classList.remove('hidden');
    var emailBox = document.getElementById('access-denied-email');
    if (emailBox) emailBox.textContent = resp.email || 'Unregistered Account';
    var msgBox = document.getElementById('access-denied-msg');
    if (msgBox) msgBox.textContent = resp.message || "Error: Your email is not registered in the company database.";
    var emailWrap = document.getElementById('header-user-email-wrap');
    if (emailWrap) emailWrap.classList.add('hidden');
    return;
  }

  // If email is required (first visit on mobile when getActiveUser() is blank and no saved email)
  if (!resp || resp.requireEmail) {
    LiveSync.stop();
    hideAllDashboards();
    var headerTitle = document.getElementById('header-store-name');
    if (headerTitle) headerTitle.textContent = "Workplace Sign In";
    var viewAuth = document.getElementById('view-auth-prompt');
    if (viewAuth) {
      viewAuth.classList.remove('hidden');
      var authInput = document.getElementById('manual-auth-email');
      if (authInput) authInput.focus();
    }
    var appContainer = document.getElementById('app-container');
    if (appContainer) appContainer.classList.remove('admin-mode');

    var emailWrap = document.getElementById('header-user-email-wrap');
    if (emailWrap) emailWrap.classList.add('hidden');
    return;
  }

  if (!resp.success) {
    LiveSync.stop();
    showToast(resp.message || "Failed to authenticate session.", "error");
    var viewAuth = document.getElementById('view-auth-prompt');
    if (viewAuth) viewAuth.classList.remove('hidden');
    return;
  }

  var role = resp.role || (resp.user && resp.user.role) || 'USER';
  var userEmail = resp.user ? resp.user.email.toLowerCase().trim() : '';

  // Persist verified email in localStorage for zero-friction future visits
  if (userEmail) {
    setPersistedUserEmail(userEmail);
  }

  AppState.setState(function(s) {
    s.isInitialized = true;
    s.isRegistered = true;
    s.currentUser = resp.user;
    s.currentRole = role;
  });

  // Top Bar User Info
  var emailWrap = document.getElementById('header-user-email-wrap');
  var emailEl = document.getElementById('header-user-email');

  if (emailWrap && emailEl && userEmail) {
    emailEl.textContent = userEmail;
    emailWrap.classList.remove('hidden');
  }

  hideAllDashboards();

  var appContainer = document.getElementById('app-container');
  var viewUser = document.getElementById('view-user-dashboard');
  var viewStoreAdmin = document.getElementById('view-store-admin-dashboard');
  var viewSuperAdmin = document.getElementById('view-super-admin-dashboard');
  var viewRegionalManager = document.getElementById('view-regional-manager-dashboard');
  var headerTitle = document.getElementById('header-store-name');

  // Strict 3-Role View Separation & Desktop Mode Trigger:
  if (role === 'SUPER_ADMIN') {
    if (appContainer) appContainer.classList.add('admin-mode');
    if (viewSuperAdmin) viewSuperAdmin.classList.remove('hidden');
    if (headerTitle) headerTitle.textContent = "Master Admin";

    cachedSuperAdminData.kpis = resp.kpis;
    cachedSuperAdminData.stores = resp.stores || [];
    cachedSuperAdminData.dateAttendance = resp.dateAttendance || { dateGroups: [] };
    cachedSuperAdminData.allUsers = resp.allUsers || [];

    renderSuperAdminUI();
  } else if (role === 'REGIONAL_MANAGER') {
    if (appContainer) appContainer.classList.add('admin-mode');
    if (viewRegionalManager) viewRegionalManager.classList.remove('hidden');
    if (headerTitle) headerTitle.textContent = "Regional Operations";

    cachedRegionalManagerData.assignedStores = resp.assignedStores || [];
    cachedRegionalManagerData.kpis = resp.kpis;
    cachedRegionalManagerData.dateAttendance = resp.dateAttendance || { dateGroups: [] };
    cachedRegionalManagerData.roster = resp.roster || [];
    cachedRegionalManagerData.selectedStoreId = 'ALL';

    renderRegionalManagerUI();
  } else if (role === 'STORE_ADMIN') {
    if (appContainer) appContainer.classList.add('admin-mode');
    if (viewStoreAdmin) viewStoreAdmin.classList.remove('hidden');

    var storeName = resp.store ? formatStoreName(resp.store.storeName) : 'Store';
    if (headerTitle) headerTitle.textContent = storeName + " Manager";

    cachedStoreAdminData.store = resp.store;
    cachedStoreAdminData.kpis = resp.kpis;
    cachedStoreAdminData.dateAttendance = resp.dateAttendance || { dateGroups: [] };
    cachedStoreAdminData.roster = resp.roster || [];

    renderStoreAdminUI();
  } else {
    // Ground Staff (USER) - Live Shift Tracker & Paired Work History
    if (appContainer) appContainer.classList.remove('admin-mode');
    if (viewUser) viewUser.classList.remove('hidden');

    AppState.setState(function(s) {
      s.stores = resp.stores || [];
      s.shiftStatus = resp.shiftStatus || s.shiftStatus;
      s.pairedHistory = resp.pairedHistory || [];
    });

    GeoTracker.start();
    GeoTracker.recalc();
    renderUserUI(AppState.getState());
  }

  // Start silent real-time background sync
  LiveSync.start();
}

/* ==========================================================================
   UI 1: SUPER ADMIN DASHBOARD LOGIC & RENDERING (DESKTOP OPTIMIZED)
   ========================================================================== */

function switchSuperAdminTab(tabName) {
  var tabLogs = document.getElementById('sa-tab-logs');
  var tabStores = document.getElementById('sa-tab-stores');
  var tabUsers = document.getElementById('sa-tab-users');

  var btnLogs = document.getElementById('sa-tab-btn-logs');
  var btnStores = document.getElementById('sa-tab-btn-stores');
  var btnUsers = document.getElementById('sa-tab-btn-users');

  if (tabLogs) tabLogs.classList.add('hidden');
  if (tabStores) tabStores.classList.add('hidden');
  if (tabUsers) tabUsers.classList.add('hidden');

  if (btnLogs) btnLogs.classList.remove('active');
  if (btnStores) btnStores.classList.remove('active');
  if (btnUsers) btnUsers.classList.remove('active');

  if (tabName === 'stores') {
    if (tabStores) tabStores.classList.remove('hidden');
    if (btnStores) btnStores.classList.add('active');
  } else if (tabName === 'users') {
    if (tabUsers) tabUsers.classList.remove('hidden');
    if (btnUsers) btnUsers.classList.add('active');
  } else {
    if (tabLogs) tabLogs.classList.remove('hidden');
    if (btnLogs) btnLogs.classList.add('active');
  }
}

function reloadSuperAdminData(onComplete) {
  var callerEmail = getCurrentUserEmail();
  var params = cachedSuperAdminData.dateAttendance || {};

  google.script.run
    .withSuccessHandler(function(resp) {
      if (onComplete) onComplete();
      if (resp && resp.success) {
        cachedSuperAdminData.kpis = resp.kpis;
        cachedSuperAdminData.stores = resp.stores || [];
        cachedSuperAdminData.dateAttendance = resp.dateAttendance || cachedSuperAdminData.dateAttendance;
        cachedSuperAdminData.allUsers = resp.allUsers || [];
        renderSuperAdminUI();
        showToast("Super Admin data refreshed.", "success");
      }
    })
    .withFailureHandler(function(err) {
      if (onComplete) onComplete();
      showToast("Refresh error: " + (err.message || err), "error");
    })
    .getSuperAdminDashboardData(
      callerEmail,
      params.startDate,
      params.endDate,
      params.sortKey,
      params.sortOrder,
      params.filterStoreId
    );
}

function renderSuperAdminUI() {
  // 1. KPI Bar
  if (cachedSuperAdminData.kpis) {
    var k = cachedSuperAdminData.kpis;
    var elStores = document.getElementById('sa-kpi-stores');

  applySuperAdminUsersFilter();

/**
 * Shared Hierarchical Date-Grouped Accordion Renderer
 */
function renderDateGroupedAccordion(dateGroups, containerEl, isSuperAdmin, searchQuery) {
  if (!containerEl) return;
  if (!dateGroups || dateGroups.length === 0) {
    containerEl.innerHTML = '<div style="text-align: center; padding: 2.5rem; font-size: 0.85rem; color: var(--ink-muted);">No attendance records found for the selected date range.</div>';
    return;
  }

  var query = String(searchQuery || '').trim().toLowerCase();
  var html = '';

  dateGroups.forEach(function(dayGroup) {
    var records = dayGroup.records || [];
    if (query) {
      records = records.filter(function(r) {
        return (r.fullName && r.fullName.toLowerCase().indexOf(query) > -1) ||
               (r.email && r.email.toLowerCase().indexOf(query) > -1) ||
               (r.employeeCode && r.employeeCode.toLowerCase().indexOf(query) > -1) ||
               (r.storeName && r.storeName.toLowerCase().indexOf(query) > -1);
      });
    }

    if (query && records.length === 0) return;

    var k = dayGroup.kpis;
    var todayPill = dayGroup.isToday ? '<span class="day-today-pill">TODAY</span>' : '';
    var prefix = (typeof isSuperAdmin === 'string') ? (isSuperAdmin + '-') : (isSuperAdmin ? 'sa-' : 'mgr-');
    var accordionId = 'date-acc-' + prefix + dayGroup.dateStr;

    html += 
      '<div class="date-accordion-card">' +
        '<div class="date-accordion-header" onclick="toggleDateAccordion(\'' + accordionId + '\')">' +
          '<div class="date-header-left">' +
            '<span class="date-accordion-title">' + escapeHtml(dayGroup.dateFormatted) + '</span>' +
            todayPill +
          '</div>' +
          '<div class="date-header-kpis">' +
            '<span class="day-kpi-badge kpi-present">Present: ' + k.totalPresent + '</span>' +
            '<span class="day-kpi-badge kpi-done">Completed: ' + k.completedShifts + '</span>' +
            (k.activeOnDuty > 0 ? '<span class="day-kpi-badge kpi-onduty">On Duty: ' + k.activeOnDuty + '</span>' : '') +
            (k.incompleteShifts > 0 ? '<span class="day-kpi-badge kpi-incomplete">Review: ' + k.incompleteShifts + '</span>' : '') +
            (k.flaggedPunches > 0 ? '<span class="day-kpi-badge kpi-flagged">Flagged: ' + k.flaggedPunches + '</span>' : '') +
            '<span class="day-kpi-badge kpi-hours">' + k.totalHours + ' hrs</span>' +
            '<span class="accordion-chevron" id="' + accordionId + '-chevron">▼</span>' +
          '</div>' +
        '</div>' +
        '<div class="date-accordion-content" id="' + accordionId + '">' +
          '<div class="date-records-table-wrap">' +
            '<table class="date-ledger-table">' +
              '<thead>' +
                '<tr>' +
                  '<th>STAFF MEMBER</th>' +
                  (isSuperAdmin ? '<th>STORE</th>' : '') +
                  '<th>CHECK-IN</th>' +
                  '<th>CHECK-OUT</th>' +
                  '<th>DURATION</th>' +
                  '<th>VERIFICATION</th>' +
                  '<th>PHOTOS</th>' +
                '</tr>' +
              '</thead>' +
              '<tbody>';

    records.forEach(function(rec) {
      var isCheckInVerified = (rec.verificationStatus === 'VERIFIED');
      var verBadgeClass = isCheckInVerified ? 'inside' : 'outside';
      var verBadgeText = isCheckInVerified ? 'Verified' : 'Flagged';

      var statusBadge = '';
      if (rec.status === 'COMPLETED') {
        statusBadge = '<span class="badge-status inside">Completed</span>';
      } else if (rec.status === 'ON_DUTY') {
        statusBadge = '<span class="badge-status inside">On Duty</span>';
      } else if (rec.status === 'INCOMPLETE') {
        statusBadge = '<span class="badge-status outside">Incomplete</span>';
      } else {
        statusBadge = '<span class="badge-status outside">Unmatched</span>';
      }

      var checkInCell = rec.checkInTime !== 'No Matching In'
        ? '<span class="ledger-time">' + escapeHtml(rec.checkInTime) + '</span>' + (rec.checkInDistance !== null && rec.checkInDistance !== undefined ? ' <span class="ledger-sub">(' + Math.round(rec.checkInDistance) + 'm)</span>' : '')
        : '<span class="ledger-sub">No Matching In</span>';

      var checkOutCell = '';
      if (rec.checkOutTime === 'On Duty') {
        checkOutCell = '<span class="badge-status inside">On Duty</span>';
      } else if (rec.checkOutTime === 'Missing Check-Out' || rec.status === 'INCOMPLETE') {
        checkOutCell = '<span class="badge-status outside">Missing Check-Out</span>';
      } else if (rec.checkOutTime && rec.checkOutTime !== '--:--') {
        checkOutCell = '<span class="ledger-time">' + escapeHtml(rec.checkOutTime) + '</span>' + (rec.checkOutDistance !== null && rec.checkOutDistance !== undefined ? ' <span class="ledger-sub">(' + Math.round(rec.checkOutDistance) + 'm)</span>' : '');
      } else {
        checkOutCell = '<span class="ledger-sub">--</span>';
      }

      var photoBtn = '';
      if (rec.checkInPhotoUrl && rec.checkOutPhotoUrl) {
        photoBtn = '<button type="button" class="btn-secondary btn-xs" onclick="openDualPhotoModal(\'' + rec.checkInPhotoUrl + '\', \'' + rec.checkOutPhotoUrl + '\', \'' + escapeHtml(rec.fullName) + '\', \'' + escapeHtml(rec.checkInTime) + '\', \'' + escapeHtml(rec.checkOutTime) + '\')">View In & Out</button>';
      } else if (rec.checkInPhotoUrl) {
        photoBtn = '<button type="button" class="btn-secondary btn-xs" onclick="openPhotoModal(\'' + rec.checkInPhotoUrl + '\', \'' + escapeHtml(rec.fullName) + ' · Check-In\')">View Photo</button>';
      } else if (rec.checkOutPhotoUrl) {
        photoBtn = '<button type="button" class="btn-secondary btn-xs" onclick="openPhotoModal(\'' + rec.checkOutPhotoUrl + '\', \'' + escapeHtml(rec.fullName) + ' · Check-Out\')">View Photo</button>';
      } else {
        photoBtn = '<span class="ledger-sub">None</span>';
      }

      html += 
        '<tr>' +
          '<td>' +
            '<div class="staff-cell-name"><strong>' + escapeHtml(rec.fullName || rec.email.split('@')[0]) + '</strong></div>' +
            '<div class="staff-cell-sub">' + escapeHtml(rec.employeeCode || 'N/A') + ' · ' + escapeHtml(rec.email) + '</div>' +
          '</td>' +
          (isSuperAdmin ? '<td><span class="store-cell-badge">' + escapeHtml(formatStoreName(rec.storeName)) + '</span></td>' : '') +
          '<td>' + checkInCell + '</td>' +
          '<td>' + checkOutCell + '</td>' +
          '<td><span class="badge-duration">' + escapeHtml(rec.durationFormatted) + '</span></td>' +
          '<td>' + statusBadge + '</td>' +
          '<td>' + photoBtn + '</td>' +
        '</tr>';
    });

    html += 
              '</tbody>' +
            '</table>' +
          '</div>' +
        '</div>' +
      '</div>';
  });

  if (html === '') {
    containerEl.innerHTML = '<div style="text-align: center; padding: 2.5rem; font-size: 0.85rem; color: var(--ink-muted);">No matching attendance records found.</div>';
  } else {
    containerEl.innerHTML = html;
  }
}

function toggleDateAccordion(id) {
  var el = document.getElementById(id);
  var chevron = document.getElementById(id + '-chevron');
  if (!el) return;
  if (el.classList.contains('collapsed')) {
    el.classList.remove('collapsed');
    if (chevron) chevron.textContent = '▼';
  } else {
    el.classList.add('collapsed');
    if (chevron) chevron.textContent = '▶';
  }
}

/**

function handleSuperAdminDatePreset(preset) {
  var buttons = document.querySelectorAll('#view-super-admin-dashboard .preset-pill');
  buttons.forEach(function(btn) { btn.classList.remove('active'); });
  if (window.event && window.event.target) window.event.target.classList.add('active');

  var range = getDatePresetRange(preset);
  var sInput = document.getElementById('sa-filter-start-date');
  var eInput = document.getElementById('sa-filter-end-date');
  if (sInput) sInput.value = range.start;
  if (eInput) eInput.value = range.end;

  cachedSuperAdminData.dateAttendance.startDate = range.start;
  cachedSuperAdminData.dateAttendance.endDate = range.end;
  fetchDateGroupedDataForSuperAdmin();
}

function fetchDateGroupedDataForSuperAdmin() {
  var feed = document.getElementById('sa-logs-feed');
  if (feed) feed.innerHTML = '<div class="ui-loading-box"><span class="ui-spinner"></span><span>Loading global attendance ledger...</span></div>';

  var callerEmail = getCurrentUserEmail();
  var params = {
    callerEmail: callerEmail,
    filterStoreId: cachedSuperAdminData.dateAttendance.filterStoreId || 'ALL',
    startDate: cachedSuperAdminData.dateAttendance.startDate,
    endDate: cachedSuperAdminData.dateAttendance.endDate,
    sortKey: cachedSuperAdminData.dateAttendance.sortKey || 'TIME',
    sortOrder: cachedSuperAdminData.dateAttendance.sortOrder || 'DESC'
  };

  google.script.run
    .withSuccessHandler(function(resp) {

        cachedSuperAdminData.dateAttendance.dateGroups = resp.dateGroups || [];
        renderSuperAdminDateFeed();
      }
    })
    .withFailureHandler(function(err) {
      showToast("Failed to load attendance: " + (err.message || err), "error");

    .getDateGroupedAttendance(params);

function handleSuperAdminAddManager(e) {
  e.preventDefault();
  var storeId = document.getElementById('change-admin-store-id').value;
  var email = document.getElementById('add-mgr-email').value;
  var name = document.getElementById('add-mgr-name').value;
  var code = document.getElementById('add-mgr-code').value;
  var isPrimary = document.getElementById('add-mgr-is-primary').checked;
  var btn = document.getElementById('btn-save-add-mgr');
  var origText = btn ? btn.textContent : '';
  var callerEmail = getCurrentUserEmail();

  if (btn) {
    btn.disabled = true;
    btn.classList.add('btn-loading');
    btn.textContent = 'Assigning...';
  }

  google.script.run
    .withSuccessHandler(function(resp) {
      if (btn) {
        btn.disabled = false;
        btn.classList.remove('btn-loading');
        btn.textContent = origText || 'Add Manager to Store';
      }
      showToast("Store Manager added successfully.", "success");
      document.getElementById('add-mgr-email').value = '';
      document.getElementById('add-mgr-name').value = '';
      document.getElementById('add-mgr-code').value = '';
      document.getElementById('add-mgr-is-primary').checked = false;

      if (resp && resp.success) {
        cachedSuperAdminData.stores = resp.stores || [];
        var updatedStore = cachedSuperAdminData.stores.find(function(s) { return s.storeId === storeId; });
        if (updatedStore) renderManageManagersModalList(updatedStore);
        renderSuperAdminStoresList();
      }
    })
    .withFailureHandler(function(err) {
      if (btn) {
        btn.disabled = false;
        btn.classList.remove('btn-loading');
        btn.textContent = origText || 'Add Manager to Store';
      }
      showToast("Failed to assign manager: " + (err.message || err), "error");
    })
    .assignStoreManager({
      callerEmail: callerEmail,
      storeId: storeId,
      managerEmail: email,
      fullName: name,
      employeeCode: code,
      isPrimary: isPrimary
    });
}

function handleSetPrimaryManager(storeId, email) {
  var callerEmail = getCurrentUserEmail();
  google.script.run
    .withSuccessHandler(function(resp) {
      showToast("Primary manager updated.", "success");
      if (resp && resp.success) {
        cachedSuperAdminData.stores = resp.stores || [];
        var updatedStore = cachedSuperAdminData.stores.find(function(s) { return s.storeId === storeId; });

    .withFailureHandler(function(err) {

    .setPrimaryStoreManager({

      storeId: storeId,
      managerEmail: email
    });
}

function handleRemoveManager(storeId, email) {
  if (!confirm("Are you sure you want to remove " + email + " from this store?")) return;
  var callerEmail = getCurrentUserEmail();
  google.script.run
    .withSuccessHandler(function(resp) {
      showToast("Manager removed from store.", "success");
      if (resp && resp.success) {
        cachedSuperAdminData.stores = resp.stores || [];
        var updatedStore = cachedSuperAdminData.stores.find(function(s) { return s.storeId === storeId; });

    .withFailureHandler(function(err) {

      callerEmail: callerEmail,
      storeId: storeId,
      managerEmail: email
    });
}

/**
 * Super Admin: All Users Filter & Actions
 */
function applySuperAdminUsersFilter() {
  var listEl = document.getElementById('sa-users-list');
  var roleFilter = document.getElementById('sa-filter-user-role') ? document.getElementById('sa-filter-user-role').value : 'ALL';
  var searchFilter = document.getElementById('sa-search-users') ? document.getElementById('sa-search-users').value.trim().toLowerCase() : '';

  if (!listEl) return;

  var users = cachedSuperAdminData.allUsers || [];
  var filtered = users.filter(function(u) {
    var matchRole = (roleFilter === 'ALL' || u.role === roleFilter);
    var matchSearch = !searchFilter ||
      (u.fullName && u.fullName.toLowerCase().indexOf(searchFilter) > -1) ||
      (u.email && u.email.toLowerCase().indexOf(searchFilter) > -1) ||
      (u.employeeCode && u.employeeCode.toLowerCase().indexOf(searchFilter) > -1);
    return matchRole && matchSearch;
  });

  if (filtered.length === 0) {
    listEl.innerHTML = '<div style="text-align: center; padding: 2rem; font-size: 0.85rem; color: var(--ink-muted);">No users found.</div>';
    return;
  }

  var html = '';
  filtered.forEach(function(u) {
    var roleBadge = (u.role === 'SUPER_ADMIN') ? '<span class="badge-role badge-role-super">SUPER ADMIN</span>'
      : (u.role === 'REGIONAL_MANAGER') ? '<span class="badge-role badge-role-super" style="background:#2563EB;color:#FFF;">REGIONAL MGR</span>'
      : (u.role === 'STORE_ADMIN') ? '<span class="badge-role badge-role-mgr">STORE ADMIN</span>'
      : '<span class="badge-role badge-role-user">STAFF</span>';

    var store = cachedSuperAdminData.stores.find(function(s) { return s.storeId === u.assignedStoreId; });
    var storeName = store ? formatStoreName(store.storeName) : (u.assignedStoreId || 'Unassigned');

    html += 
      '<div class="activity-card-item" style="background: #FFFFFF;">' +
        '<div class="activity-row-top">' +
          '<div class="activity-store-name"><strong>' + escapeHtml(u.fullName || 'User') + '</strong> <span style="font-size: 0.75rem; color: var(--ink-muted);">(' + escapeHtml(u.employeeCode || 'N/A') + ')</span></div>' +
          roleBadge +
        '</div>' +
        '<div style="font-size: 0.78rem; color: var(--ink-secondary); margin-bottom: 0.4rem; line-height: 1.4;">' +
          'Email: ' + escapeHtml(u.email) + '<br>' +
          'Store: <strong>' + escapeHtml(storeName) + '</strong> · Status: <strong>' + escapeHtml(u.status) + '</strong>' +
        '</div>' +
        '<div style="display: flex; justify-content: flex-end;">' +
          '<button type="button" class="btn-secondary btn-sm" onclick="openEditUserModal(\'' + u.email + '\')">Edit Access</button>' +
        '</div>' +
      '</div>';
  });

  listEl.innerHTML = html;
}

/* ==========================================================================
   UI 3: GROUND STAFF (USER) ATTENDANCE CHECK-IN & LIVE SHIFT TRACKER
   ========================================================================== */

function renderUserUI(state) {
  var store = AppState.getSelectedStore();
  var rawStoreName = store ? store.storeName : '';
  var displayStoreName = formatStoreName(rawStoreName);

  // 1. Header Title: Formatted Mother Hub Name
  var headerTitle = document.getElementById('header-store-name');
  if (headerTitle) {
    headerTitle.textContent = displayStoreName;
  }

  // 2. Card Header: Formatted Store Name
  var storeTitle = document.getElementById('store-title-label');
  if (storeTitle) {
    storeTitle.textContent = displayStoreName || 'Locating Store...';
  }

  // 3. Live Workday Shift Tracker Widget
  var shift = state.shiftStatus || { status: 'NOT_CHECKED_IN' };
  var trackerCard = document.getElementById('user-shift-tracker-card');
  var trackerDutyTitle = document.getElementById('tracker-duty-title');
  var trackerDutyBadge = document.getElementById('tracker-duty-badge');
  var trackerActiveBox = document.getElementById('tracker-active-box');
  var trackerCompletedBox = document.getElementById('tracker-completed-box');
  var trackerCheckInTime = document.getElementById('tracker-checkin-time');
  var trackerStoreName = document.getElementById('tracker-store-name');
  var trackerTodayDur = document.getElementById('tracker-total-today-dur');
  var trackerShiftsCount = document.getElementById('tracker-shifts-count');
  var trackerMiniShifts = document.getElementById('tracker-today-shifts-list');

  if (shift.status === 'ON_DUTY' && shift.activeShift) {
    if (trackerDutyTitle) trackerDutyTitle.textContent = 'On Duty';
    if (trackerDutyBadge) {
      trackerDutyBadge.className = 'badge-status inside';
      trackerDutyBadge.textContent = 'On Duty';
    }
    if (trackerActiveBox) trackerActiveBox.classList.remove('hidden');
    if (trackerCompletedBox) trackerCompletedBox.classList.add('hidden');
    if (trackerCheckInTime) trackerCheckInTime.textContent = shift.activeShift.checkInTimeFormatted || shift.activeShift.checkInTimeStr || '--:--';
    if (trackerStoreName) trackerStoreName.textContent = formatStoreName(shift.activeShift.storeName || (store ? store.storeName : 'Mother Hub'));

    // Start / sync live stopwatch
    shiftElapsedSeconds = (shift.activeShift.elapsedSeconds !== undefined && shift.activeShift.elapsedSeconds !== null)
      ? shift.activeShift.elapsedSeconds 
      : 0;
    startShiftStopwatch();
  } else if (shift.status === 'SHIFT_COMPLETED') {
    stopShiftStopwatch();
    if (trackerDutyTitle) trackerDutyTitle.textContent = 'Shift Completed';
    if (trackerDutyBadge) {
      trackerDutyBadge.className = 'badge-status outside';
      trackerDutyBadge.textContent = 'Off Duty';
    }
    if (trackerActiveBox) trackerActiveBox.classList.add('hidden');
    if (trackerCompletedBox) trackerCompletedBox.classList.remove('hidden');
    if (trackerTodayDur) trackerTodayDur.textContent = shift.totalTodayFormatted || shift.todayTotalDurationFormatted || '0h 00m';
    if (trackerShiftsCount) {
      var completedCount = (shift.todayShifts && shift.todayShifts.length) || shift.todayCompletedShiftsCount || 0;
      trackerShiftsCount.textContent = completedCount + ' Shift(s)';
    }

    // Mini chips list of today's shifts
    if (trackerMiniShifts && shift.todayShifts && shift.todayShifts.length > 0) {
      var chipsHtml = '';
      shift.todayShifts.forEach(function(s, idx) {
        var dur = s.durationFormatted || '--';
        var inT = s.checkInTime || s.checkInTimeStr || '--';
        var outT = s.checkOutTime || s.checkOutTimeStr || '--';
        chipsHtml += '<span class="mini-shift-chip">Shift #' + (idx + 1) + ': ' + escapeHtml(inT) + ' - ' + escapeHtml(outT) + ' (' + escapeHtml(dur) + ')</span>';
      });
      trackerMiniShifts.innerHTML = chipsHtml;
    } else if (trackerMiniShifts) {
      trackerMiniShifts.innerHTML = '';
    }
  } else {
    // NOT_CHECKED_IN
    stopShiftStopwatch();
    if (trackerDutyTitle) trackerDutyTitle.textContent = 'Not Checked In';
    if (trackerDutyBadge) {
      trackerDutyBadge.className = 'badge-status checking';
      trackerDutyBadge.textContent = 'NOT ON DUTY';
    }
    if (trackerActiveBox) trackerActiveBox.classList.add('hidden');
    if (trackerCompletedBox) trackerCompletedBox.classList.add('hidden');
  }

  // 4. Location Status Badge & Distinct Button States
  var locationBadge = document.getElementById('location-badge');
  var btnTakePhoto = document.getElementById('btn-take-photo');
  var btnMainPunch = document.getElementById('btn-main-punch');

  var actionLabel = (currentCheckType === 'CHECK_IN') ? 'Check In' : 'Check Out';

  // Photo button label (Zero Emojis)
  if (btnTakePhoto) {
    btnTakePhoto.textContent = capturedSelfieBase64 ? 'Retake Photo' : 'Take Photo';
  }

  if (locationBadge) {
    if (state.geo.status === 'ERROR') {
      locationBadge.className = 'badge-status error';
      locationBadge.textContent = 'Location unavailable';
      if (btnMainPunch) {
        btnMainPunch.disabled = true;
        btnMainPunch.classList.remove('ready');
        btnMainPunch.textContent = 'Enable location to ' + actionLabel;
      }
    } else if (state.geo.distance === null || state.geo.status === 'LOCKING' || state.geo.status === 'INITIALIZING') {
      locationBadge.className = 'badge-status checking';
      locationBadge.textContent = 'Checking location...';
      if (btnMainPunch) {
        btnMainPunch.disabled = true;
        btnMainPunch.classList.remove('ready');
        btnMainPunch.textContent = 'Checking location...';
      }
    } else if (state.geo.isInside) {
      locationBadge.className = 'badge-status inside';
      locationBadge.textContent = 'At Store · ' + Math.round(state.geo.distance) + 'm away';

      if (btnMainPunch) {
        if (!capturedSelfieBase64) {
          btnMainPunch.disabled = true;
          btnMainPunch.classList.remove('ready');
          btnMainPunch.textContent = 'Take Photo to ' + actionLabel;
        } else {
          btnMainPunch.disabled = false;
          btnMainPunch.classList.add('ready');
          btnMainPunch.textContent = 'Proceed to ' + actionLabel;
        }
      }
    } else {
      locationBadge.className = 'badge-status outside';
      locationBadge.textContent = 'Too far from store · ' + Math.round(state.geo.distance) + 'm away';
      if (btnMainPunch) {
        btnMainPunch.disabled = true;
        btnMainPunch.classList.remove('ready');
        btnMainPunch.textContent = 'Move closer (' + Math.round(state.geo.distance) + 'm away)';
      }
    }
  }

  // 5. Personal Attendance History Ledger
  renderPersonalHistory(state.pairedHistory || state.recentLogs);
}

/**
 * Triggers native device camera
 */
function triggerNativeCamera() {
  var input = document.getElementById('native-camera-input');
  if (input) {
    input.value = '';
    input.click();
  }
}

/**
 * Processes camera capture
 */
function handleNativeCameraCapture(event) {
  var file = event.target.files && event.target.files[0];
  if (!file) return;

  var state = AppState.getState();
  var store = AppState.getSelectedStore();
  var user = state.currentUser;

  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      try {
        var metadata = {
          email: user ? user.email : '',
          employeeCode: user ? user.employeeCode : '',
          storeName: store ? store.storeName : 'Mother Hub',
          checkType: currentCheckType,
          distance: state.geo.distance !== null ? Math.round(state.geo.distance) : null,
          isInside: state.geo.isInside,
          lat: state.geo.lat,
          lng: state.geo.lng,
          accuracy: state.geo.accuracy
        };

        var watermarkedBase64 = CameraWatermark.burnWatermarkFromImage(img, metadata);
        setCapturedPhoto(watermarkedBase64);
        showToast("Photo captured! Tap Proceed to submit.", "success");
      } catch (err) {
        showToast("Error processing photo: " + err.message, "error");
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function setCapturedPhoto(base64Data) {
  capturedSelfieBase64 = base64Data;
  var previewImg = document.getElementById('selfie-preview-img');
  var placeholder = document.getElementById('camera-placeholder');

  if (placeholder) placeholder.classList.add('hidden');
  if (previewImg) {
    previewImg.src = base64Data;
    previewImg.classList.remove('hidden');
  }

  renderUserUI(AppState.getState());
}

function resetCapturedPhoto() {
  capturedSelfieBase64 = null;
  var previewImg = document.getElementById('selfie-preview-img');
  var placeholder = document.getElementById('camera-placeholder');
  var nativeInput = document.getElementById('native-camera-input');

  if (previewImg) {
    previewImg.src = '';
    previewImg.classList.add('hidden');
  }
  if (placeholder) placeholder.classList.remove('hidden');
  if (nativeInput) nativeInput.value = '';

  renderUserUI(AppState.getState());
}

function handleProceedClick() {
  var state = AppState.getState();
  var store = AppState.getSelectedStore();

  if (!store) {
    showToast("Waiting for nearest Mother Hub location...", "error");
    return;
  }

  if (!state.geo.isInside) {
    showToast("Cannot submit: Outside " + formatStoreName(store.storeName) + " boundary.", "error");
    return;
  }

  if (!capturedSelfieBase64) {
    showToast("Please tap 'Take Photo' first.", "info");
    triggerNativeCamera();
    return;
  }

  handleSubmitPunch();
}

function handleSubmitPunch() {
  var state = AppState.getState();
  var store = AppState.getSelectedStore();
  var user = state.currentUser;

  var btnMainPunch = document.getElementById('btn-main-punch');
  var origPunchText = btnMainPunch ? btnMainPunch.textContent : '';
  var loader = document.getElementById('submission-loader');

  if (btnMainPunch) {
    btnMainPunch.disabled = true;
    btnMainPunch.classList.add('btn-loading');
    btnMainPunch.textContent = 'Submitting...';
  }
  if (loader) loader.classList.remove('hidden');

  var payload = {
    email: user ? user.email : getCurrentUserEmail(),
    storeId: store.storeId,
    checkType: currentCheckType,
    userLat: state.geo.lat,
    userLng: state.geo.lng,
    accuracyMeters: state.geo.accuracy,
    deviceType: state.geo.deviceType,
    base64Selfie: capturedSelfieBase64
  };

  google.script.run
    .withSuccessHandler(function(resp) {
      if (loader) loader.classList.add('hidden');
      if (btnMainPunch) {
        btnMainPunch.disabled = false;
        btnMainPunch.classList.remove('btn-loading');
        btnMainPunch.textContent = origPunchText || 'Proceed to Check In';
      }

      if (resp && resp.success) {
        var actionText = (resp.checkType === 'CHECK_OUT') ? 'Checked Out' : 'Checked In';
        showToast(actionText + " successfully at " + formatStoreName(resp.storeName || store.storeName) + ".", "success");
        resetCapturedPhoto();

        // Update reactive state directly from response payload
        if (resp.shiftStatus) {
          AppState.setShiftStatus(resp.shiftStatus);
          setPunchType(resp.shiftStatus.status === 'ON_DUTY' ? 'CHECK_OUT' : 'CHECK_IN');
        }
        if (resp.pairedHistory) {
          AppState.setPairedHistory(resp.pairedHistory);
        }

        reloadSessionData(user ? user.email : '', function() {
          LiveSync.triggerImmediate();
        });
      } else {
        showToast("Submission failed: " + (resp ? resp.message : "Unknown error"), "error");
      }
    })
    .withFailureHandler(function(err) {
      if (loader) loader.classList.add('hidden');
      if (btnMainPunch) {
        btnMainPunch.disabled = false;
        btnMainPunch.classList.remove('btn-loading');
        btnMainPunch.textContent = origPunchText || 'Proceed to Check In';
      }
      showToast("Submission error: " + (err.message || err), "error");
    })
    .submitAttendanceLog(payload);
}

/**
 * Render personal attendance ledger with paired Check-In & Check-Out records
 */
function renderPersonalHistory(history) {
  var listEl = document.getElementById('personal-history-list');
  if (!listEl) return;

  if (!history || history.length === 0) {
    listEl.innerHTML = 
      '<div style="text-align: center; padding: 1.5rem; font-size: 0.85rem; color: var(--ink-muted);">' +
        'No recent attendance recorded.' +
      '</div>';
    return;
  }

  // Check if history is new paired date-grouped format
  var isDateGrouped = history[0] && Array.isArray(history[0].shifts);

  if (!isDateGrouped) {
    // Graceful fallback for legacy flat logs
    var html = '';
    history.forEach(function(log) {
      var isCheckIn = (log.checkType === 'CHECK_IN');
      var badgeClass = isCheckIn ? 'inside' : 'checking';
      var badgeText = isCheckIn ? 'Checked In' : 'Checked Out';
      var itemCardClass = isCheckIn ? 'check-in' : 'check-out';

      var dateObj = new Date(log.timestamp);
      var timeFormatted = !isNaN(dateObj.getTime()) 
        ? dateObj.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ', ' + dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        : log.timestamp;

      var distStr = (log.distanceMeters !== undefined && log.distanceMeters !== null) ? ' · ' + Math.round(log.distanceMeters) + 'm' : '';
      var displayStore = formatStoreName(log.storeName || 'Mother Hub');

      html += 
        '<div class="activity-card-item ' + itemCardClass + '">' +
          '<div class="activity-row-top">' +
            '<div class="activity-store-name" title="' + escapeHtml(displayStore) + '">' + escapeHtml(displayStore) + '</div>' +
            '<span class="badge-status ' + badgeClass + '">' + badgeText + '</span>' +
          '</div>' +
          '<div class="activity-row-bottom">' +
            '<span class="activity-time-text">' + escapeHtml(timeFormatted) + distStr + '</span>' +
            (log.selfieDriveUrl ? '<button type="button" class="btn-view-photo" onclick="openPhotoModal(\'' + log.selfieDriveUrl + '\', \'' + badgeText + ' Photo\')">View Photo</button>' : '') +
          '</div>' +
        '</div>';
    });
    listEl.innerHTML = html;
    return;
  }

  // Render paired date-grouped workday sessions
  var html = '';
  history.forEach(function(day) {
    html += 
      '<div class="day-ledger-card">' +
        '<div class="day-ledger-header">' +
          '<div class="day-ledger-date">' + escapeHtml(day.dateFormatted) + '</div>' +
          '<div class="day-total-badge">' + escapeHtml(day.totalDayFormatted || '0h 00m') + '</div>' +
        '</div>' +
        '<div class="day-shifts-list">';

    if (!day.shifts || day.shifts.length === 0) {
      html += '<div style="padding: 0.5rem 0.75rem; font-size: 0.75rem; color: var(--ink-muted);">No recorded shifts on this date.</div>';
    } else {
      day.shifts.forEach(function(shift, sIdx) {
        var isCompleted = (shift.status === 'COMPLETED');
        var isOnDuty = (shift.status === 'ON_DUTY');
        var isIncomplete = (shift.status === 'INCOMPLETE');

        var badgeClass = isCompleted ? 'inside' : (isOnDuty ? 'inside' : (isIncomplete ? 'outside' : 'checking'));
        var badgeText = isCompleted ? 'Completed' : (isOnDuty ? 'On Duty' : (isIncomplete ? 'Missing Out' : shift.status));

        var displayStore = formatStoreName(shift.storeName || 'Mother Hub');

        var checkInText = shift.checkInTime || '--:--';
        if (shift.checkInDistance !== null && shift.checkInDistance !== undefined) {
          checkInText += ' (' + Math.round(shift.checkInDistance) + 'm)';
        }

        var checkOutText = shift.checkOutTime || '--:--';
        if (shift.checkOutDistance !== null && shift.checkOutDistance !== undefined) {
          checkOutText += ' (' + Math.round(shift.checkOutDistance) + 'm)';
        }

        var photoActions = '';
        if (shift.checkInPhotoUrl && shift.checkOutPhotoUrl) {
          photoActions = '<button type="button" class="btn-secondary btn-xs" onclick="openDualPhotoModal(\'' + shift.checkInPhotoUrl + '\', \'' + shift.checkOutPhotoUrl + '\', \'Workday Shift #' + (sIdx + 1) + '\', \'' + escapeHtml(shift.checkInTime) + '\', \'' + escapeHtml(shift.checkOutTime) + '\')">View Both Photos</button>';
        } else if (shift.checkInPhotoUrl) {
          photoActions = '<button type="button" class="btn-secondary btn-xs" onclick="openPhotoModal(\'' + shift.checkInPhotoUrl + '\', \'Check-In Photo\')">View Entry Photo</button>';
        } else if (shift.checkOutPhotoUrl) {
          photoActions = '<button type="button" class="btn-secondary btn-xs" onclick="openPhotoModal(\'' + shift.checkOutPhotoUrl + '\', \'Check-Out Photo\')">View Exit Photo</button>';
        }

        html += 
          '<div class="paired-shift-item ' + (isIncomplete ? 'shift-incomplete' : (isOnDuty ? 'shift-onduty' : '')) + '">' +
            '<div class="paired-shift-top">' +
              '<span class="paired-shift-store">' + escapeHtml(displayStore) + '</span>' +
              '<span class="badge-status ' + badgeClass + '">' + badgeText + '</span>' +
            '</div>' +
            '<div class="shift-times-row">' +
              '<div class="time-block">' +
                '<span class="time-label">PUNCH IN</span>' +
                '<span class="time-val">' + escapeHtml(checkInText) + '</span>' +
              '</div>' +
              '<div class="time-arrow">→</div>' +
              '<div class="time-block">' +
                '<span class="time-label">PUNCH OUT</span>' +
                '<span class="time-val ' + (isIncomplete ? 'text-red' : '') + '">' + escapeHtml(checkOutText) + '</span>' +
              '</div>' +
              '<div class="time-duration-wrap">' +
                '<span class="badge-duration">' + escapeHtml(shift.durationFormatted || '--') + '</span>' +
              '</div>' +
            '</div>' +
            (photoActions ? '<div class="paired-shift-actions">' + photoActions + '</div>' : '') +
          '</div>';
      });
    }

    html += 
        '</div>' +
      '</div>';
  });

  listEl.innerHTML = html;
}

function switchRegionalManagerTab(tab) {
  var logsTabBtn = document.getElementById('rm-tab-btn-logs');
  var rosterTabBtn = document.getElementById('rm-tab-btn-roster');
  var logsTab = document.getElementById('rm-tab-logs');
  var rosterTab = document.getElementById('rm-tab-roster');

  if (tab === 'roster') {
    if (logsTabBtn) logsTabBtn.classList.remove('active');
    if (rosterTabBtn) rosterTabBtn.classList.add('active');
    if (logsTab) logsTab.classList.add('hidden');
    if (rosterTab) rosterTab.classList.remove('hidden');
  } else {
    if (logsTabBtn) logsTabBtn.classList.add('active');
    if (rosterTabBtn) rosterTabBtn.classList.remove('active');
    if (logsTab) logsTab.classList.remove('hidden');
    if (rosterTab) rosterTab.classList.add('hidden');
  }
}

function renderRegionalManagerUI() {
  var data = cachedRegionalManagerData;
  var stores = data.assignedStores || [];

  // Update Hubs Count Banner & KPIs
  var hubsCountEl = document.getElementById('rm-banner-hubs-count');
  if (hubsCountEl) hubsCountEl.textContent = stores.length;

  var kpiOnDuty = document.getElementById('rm-kpi-onduty');
  var kpiCheckedIn = document.getElementById('rm-kpi-checkedin');

function renderRMHubSelector() {
  var pillsContainer = document.getElementById('rm-hub-pills');
  var targetSelect = document.getElementById('rm-add-target-hub');
  var batchTargetSelect = document.getElementById('rm-batch-target-hub');
  var stores = cachedRegionalManagerData.assignedStores || [];
  var currentSelected = cachedRegionalManagerData.selectedStoreId || 'ALL';

  if (pillsContainer) {
    var pillsHtml = '<button type="button" class="preset-pill ' + (currentSelected === 'ALL' ? 'active' : '') + '" onclick="handleRMSelectHub(\'ALL\')">All My Hubs (' + stores.length + ')</button>';
    stores.forEach(function(s) {
      var isActive = (currentSelected === s.storeId);
      pillsHtml += '<button type="button" class="preset-pill ' + (isActive ? 'active' : '') + '" onclick="handleRMSelectHub(\'' + s.storeId + '\')">' + escapeHtml(formatStoreName(s.storeName)) + '</button>';
    });
    pillsContainer.innerHTML = pillsHtml;
  }

  // Populate Dropdown for Single Add and Batch Add
  var optionsHtml = '<option value="">Select Mother Hub...</option>';
  stores.forEach(function(s) {
    optionsHtml += '<option value="' + s.storeId + '">' + escapeHtml(formatStoreName(s.storeName)) + ' (' + escapeHtml(s.storeId) + ')</option>';
  });

  if (targetSelect) {
    var prevVal = targetSelect.value;
    targetSelect.innerHTML = optionsHtml;
    if (prevVal) targetSelect.value = prevVal;
    else if (currentSelected !== 'ALL') targetSelect.value = currentSelected;
  }
  if (batchTargetSelect) {
    var prevVal2 = batchTargetSelect.value;
    batchTargetSelect.innerHTML = optionsHtml;
    if (prevVal2) batchTargetSelect.value = prevVal2;
    else if (currentSelected !== 'ALL') batchTargetSelect.value = currentSelected;
  }
}

function handleRMSelectHub(storeId) {
  cachedRegionalManagerData.selectedStoreId = storeId;

  renderRMHubSelector();

function handleRMDatePreset(preset) {
  var range = getDatePresetRange(preset);
  var startInput = document.getElementById('rm-filter-start-date');
  var endInput = document.getElementById('rm-filter-end-date');
  if (startInput) startInput.value = range.start;
  if (endInput) endInput.value = range.end;

  cachedRegionalManagerData.dateAttendance.startDate = range.start;
  cachedRegionalManagerData.dateAttendance.endDate = range.end;

  // Update active class on preset pills in logs tab
  var parentRow = document.querySelector('#rm-tab-logs .preset-pills-row');
  if (parentRow) {
    var pills = parentRow.querySelectorAll('.preset-pill');
    pills.forEach(function(p) {
      var txt = p.textContent.trim().toUpperCase();
      var targetTxt = (preset === 'WEEK' ? 'THIS WEEK' : preset === 'MONTH' ? 'THIS MONTH' : preset === 'ALL' ? 'ALL TIME' : preset);
      if (txt === targetTxt) {
        p.classList.add('active');
      } else {
        p.classList.remove('active');
      }
    });
  }

  fetchDateGroupedDataForRegionalManager();
}

function handleRMDateRangeChange() {
  var startInput = document.getElementById('rm-filter-start-date');
  var endInput = document.getElementById('rm-filter-end-date');
  cachedRegionalManagerData.dateAttendance.startDate = startInput ? startInput.value : '';

function fetchDateGroupedDataForRegionalManager() {
  var feed = document.getElementById('rm-logs-feed');
  if (feed) feed.innerHTML = '<div class="ui-loading-box"><span class="ui-spinner"></span><span>Loading cluster attendance ledger...</span></div>';

  var callerEmail = getCurrentUserEmail();
  var payload = {
    callerEmail: callerEmail,
    filterStoreId: cachedRegionalManagerData.selectedStoreId || 'ALL',
    startDate: cachedRegionalManagerData.dateAttendance.startDate,
    endDate: cachedRegionalManagerData.dateAttendance.endDate,
    sortKey: cachedRegionalManagerData.dateAttendance.sortKey || 'TIME',
    sortOrder: cachedRegionalManagerData.dateAttendance.sortOrder || 'DESC'
  };

  google.script.run
    .withSuccessHandler(function(resp) {
      if (resp && resp.success) {
        cachedRegionalManagerData.assignedStores = resp.assignedStores || cachedRegionalManagerData.assignedStores;
        cachedRegionalManagerData.kpis = resp.kpis;
        if (resp.dateAttendance && resp.dateAttendance.dateGroups) {
          cachedRegionalManagerData.dateAttendance.dateGroups = resp.dateAttendance.dateGroups;
        }
        cachedRegionalManagerData.roster = resp.roster || cachedRegionalManagerData.roster;
        
        // Update KPI tiles
        var kpis = resp.kpis || { totalStaff: 0, checkedInToday: 0, activeOnDuty: 0 };
        var kpiOnDuty = document.getElementById('rm-kpi-onduty');
        var kpiCheckedIn = document.getElementById('rm-kpi-checkedin');
        var kpiTotalStaff = document.getElementById('rm-kpi-totalstaff');
        if (kpiOnDuty) kpiOnDuty.textContent = kpis.activeOnDuty || 0;
        if (kpiCheckedIn) kpiCheckedIn.textContent = kpis.checkedInToday || 0;
        if (kpiTotalStaff) kpiTotalStaff.textContent = kpis.totalStaff || (cachedRegionalManagerData.roster ? cachedRegionalManagerData.roster.length : 0);

        renderRMDateFeed();
      }
    })
    .withFailureHandler(function(err) {
      showToast("Failed to load attendance: " + (err.message || err), "error");
    })
    .getRegionalManagerDashboardData(payload);
}

function renderRMRosterTable() {
  var listEl = document.getElementById('rm-roster-list');
  if (!listEl) return;

  var roster = cachedRegionalManagerData.roster || [];
  var selectedHub = cachedRegionalManagerData.selectedStoreId || 'ALL';
  var query = String(cachedRegionalManagerData.rosterSearchQuery || '').trim().toLowerCase();

  var filtered = roster.filter(function(u) {
    var matchHub = (selectedHub === 'ALL' || u.assignedStoreId === selectedHub);
    var matchQuery = !query ||
      (u.fullName && u.fullName.toLowerCase().indexOf(query) > -1) ||
      (u.email && u.email.toLowerCase().indexOf(query) > -1) ||
      (u.employeeCode && u.employeeCode.toLowerCase().indexOf(query) > -1);
    return matchHub && matchQuery;
  });

  if (filtered.length === 0) {
    listEl.innerHTML = '<div style="text-align: center; padding: 2rem; font-size: 0.82rem; color: var(--text-muted);">No personnel found matching the filter.</div>';
    return;
  }

  var stores = cachedRegionalManagerData.assignedStores || [];
  var html = '';
  filtered.forEach(function(u) {
    var store = stores.find(function(s) { return s.storeId === u.assignedStoreId; });
    var storeName = store ? formatStoreName(store.storeName) : (u.assignedStoreId || 'Unassigned');
    var isSuperAdmin = (u.role === 'SUPER_ADMIN');
    var isHubManager = (u.role === 'STORE_ADMIN' || (u.employeeCode && u.employeeCode.indexOf('MGR') > -1) || (u.designation && u.designation.toUpperCase().indexOf('MANAGER') > -1));
    var roleBadge = isSuperAdmin
      ? '<span class="badge-role badge-role-super" style="background:#0F172A;color:#FFFFFF;font-weight:700;">SUPER ADMIN</span>'
      : (isHubManager
        ? '<span class="badge-role badge-role-mgr">HUB MANAGER</span>'
        : '<span class="badge-role badge-role-user">STAFF</span>');

    var actionHtml = isSuperAdmin
      ? '<span style="font-size: 0.72rem; color: var(--text-muted); font-weight: 500; padding: 0.2rem 0;">Protected (Super Admin)</span>'
      : '<button type="button" class="btn-danger btn-xs" onclick="handleRMRemoveStaff(\'' + escapeHtml(u.email) + '\', \'' + escapeHtml(u.assignedStoreId) + '\')">Remove from Hub</button>';

    html += 
      '<div class="activity-card-item" style="background: var(--bg-card);">' +
        '<div class="activity-row-top">' +
          '<div class="activity-store-name"><strong>' + escapeHtml(u.fullName || 'Employee') + '</strong> <span style="font-size: 0.75rem; color: var(--text-muted);">(' + escapeHtml(u.employeeCode || 'STAFF') + ')</span></div>' +
          roleBadge +
        '</div>' +
        '<div style="font-size: 0.78rem; color: var(--text-secondary); margin-bottom: 0.4rem; line-height: 1.4;">' +
          escapeHtml(u.email) + ' · <span class="store-cell-badge">' + escapeHtml(storeName) + '</span>' +
        '</div>' +
        '<div style="display: flex; gap: 0.4rem; justify-content: flex-end; margin-top: 0.5rem; align-items: center;">' +
          actionHtml +
        '</div>' +
      '</div>';
  });

  listEl.innerHTML = html;
}

function handleRMAddSingleStaff(e) {
  if (e && e.preventDefault) e.preventDefault();
  var targetHub = document.getElementById('rm-add-target-hub').value;
  var email = document.getElementById('rm-add-staff-email').value;
  var name = document.getElementById('rm-add-staff-name').value;
  var code = document.getElementById('rm-add-staff-code').value;
  var roleDesignation = document.getElementById('rm-add-staff-role').value;
  var btn = document.getElementById('btn-rm-add-staff-submit');
  var origText = btn ? btn.textContent : '';
  var callerEmail = getCurrentUserEmail();

  if (!targetHub) {
    showToast("Please select a target Mother Hub.", "error");
    return;
  }
  if (!email || email.indexOf('@') === -1) {
    showToast("Please enter a valid corporate email.", "error");
    return;
  }

  if (btn) {
    btn.disabled = true;
    btn.classList.add('btn-loading');
    btn.textContent = 'Adding to Roster...';
  }

  google.script.run
    .withSuccessHandler(function(resp) {
      if (btn) {
        btn.disabled = false;
        btn.classList.remove('btn-loading');
        btn.textContent = origText || 'Add to Hub Roster';
      }
      showToast("Personnel added to Mother Hub roster.", "success");
      document.getElementById('rm-add-staff-email').value = '';
      document.getElementById('rm-add-staff-name').value = '';
      document.getElementById('rm-add-staff-code').value = '';

      if (resp && resp.success) {
        cachedRegionalManagerData.roster = resp.roster || cachedRegionalManagerData.roster;
        cachedRegionalManagerData.kpis = resp.kpis || cachedRegionalManagerData.kpis;
        renderRegionalManagerUI();
      }
    })
    .withFailureHandler(function(err) {
      if (btn) {
        btn.disabled = false;
        btn.classList.remove('btn-loading');
        btn.textContent = origText || 'Add to Hub Roster';
      }
      showToast("Failed to add personnel: " + (err.message || err), "error");
    })
    .addSingleStaffToHub({
      callerEmail: callerEmail,
      storeId: targetHub,
      email: email,
      fullName: name,
      employeeCode: code,
      designation: roleDesignation
    });
}

function handleRMRemoveStaff(staffEmail, storeId) {
  var cleanTargetEmail = String(staffEmail).trim().toLowerCase();
  var target = (cachedRegionalManagerData.roster || []).find(function(r) {
    return String(r.email).trim().toLowerCase() === cleanTargetEmail;
  });
  if (target && target.role === 'SUPER_ADMIN') {
    showToast("Permission denied: Super Admin is the top-level authority and cannot be removed.", "error");
    return;
  }

  if (!confirm("Are you sure you want to remove " + staffEmail + " from this Mother Hub?")) return;
  var callerEmail = getCurrentUserEmail();
  showToast("Removing personnel...", "info");

  google.script.run
    .withSuccessHandler(function(resp) {
      showToast("Personnel removed from roster.", "success");
      if (resp && resp.success) {
        cachedRegionalManagerData.roster = resp.roster || cachedRegionalManagerData.roster;
        cachedRegionalManagerData.kpis = resp.kpis || cachedRegionalManagerData.kpis;
        renderRegionalManagerUI();
      }
    })
    .withFailureHandler(function(err) {
      showToast("Error removing personnel: " + (err.message || err), "error");
    })
    .removeStaffFromHub({
      callerEmail: callerEmail,
      storeId: storeId,
      email: staffEmail
    });
}

  var modal = document.getElementById('modal-rm-batch-upload');

}

function handleRMSubmitBatchRoster(e) {
  if (e && e.preventDefault) e.preventDefault();
  var targetHub = document.getElementById('rm-batch-target-hub').value;
  var rawText = document.getElementById('rm-batch-roster-text').value;
  var btn = document.getElementById('btn-rm-batch-submit');
  var origText = btn ? btn.textContent : '';
  var callerEmail = getCurrentUserEmail();

  if (!targetHub) {
    showToast("Please select a target Mother Hub.", "error");
    return;
  }
  if (!rawText.trim()) {
    showToast("Please paste CSV roster entries.", "error");
    return;
  }

  // Parse lines
  var lines = rawText.split('\n');
  var rosterRows = [];
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    var parts = line.split(',');
    if (parts.length >= 1) {
      var email = parts[0].trim().toLowerCase();
      if (!email || email.indexOf('@') === -1) continue;
      var name = parts.length > 1 ? parts[1].trim() : '';
      var code = parts.length > 2 ? parts[2].trim() : '';
      var desig = parts.length > 3 ? parts[3].trim().toUpperCase() : 'STAFF';
      rosterRows.push({
        email: email,
        fullName: name,
        employeeCode: code,
        designation: desig
      });
    }
  }

  if (rosterRows.length === 0) {
    showToast("No valid email addresses found in the pasted data.", "error");
    return;
  }

  if (btn) {
    btn.disabled = true;
    btn.classList.add('btn-loading');
    btn.textContent = 'Uploading ' + rosterRows.length + ' Personnel...';
  }

  google.script.run
    .withSuccessHandler(function(resp) {
      if (btn) {
        btn.disabled = false;
        btn.classList.remove('btn-loading');
        btn.textContent = origText || 'Upload & Provision Roster';
      }
      closeRMBatchUploadModal();
      showToast("Roster provisioned successfully (" + (resp.processedCount || rosterRows.length) + " personnel).", "success");

      if (resp && resp.success) {
        cachedRegionalManagerData.roster = resp.roster || cachedRegionalManagerData.roster;
        cachedRegionalManagerData.kpis = resp.kpis || cachedRegionalManagerData.kpis;
        renderRegionalManagerUI();
      }
    })
    .withFailureHandler(function(err) {
      if (btn) {
        btn.disabled = false;
        btn.classList.remove('btn-loading');
        btn.textContent = origText || 'Upload & Provision Roster';
      }
      showToast("Failed to upload roster: " + (err.message || err), "error");
    })
    .uploadHubRoster({
      callerEmail: callerEmail,
      storeId: targetHub,
      rosterRows: rosterRows
    });
}

/* ==========================================================================
   IN-APP VERIFICATION PHOTO MODALS (ZERO EMOJIS)
   Fetches Base64 from Google Apps Script and sets img.src = dataUri
   ========================================================================== */

/**
 * Single Photo Modal
 */
function openPhotoModal(imgUrlOrId, title) {
  var modal = document.getElementById('view-photo-modal');
  var img = document.getElementById('photo-modal-img');
  var spinner = document.getElementById('photo-modal-spinner');
  var titleEl = document.getElementById('photo-modal-title');

  if (titleEl) titleEl.textContent = title || 'Verification Photo';
  if (modal) modal.classList.remove('hidden');

  // Reset to loading state
  if (img) {
    img.src = '';
    img.classList.add('hidden');
  }
  if (spinner) {
    spinner.textContent = 'Loading verification photo...';
    spinner.style.color = '#FFFFFF';
    spinner.classList.remove('hidden');
  }

  // Fetch Base64 data URI directly from server
  google.script.run
    .withSuccessHandler(function(dataUri) {
      if (spinner) spinner.classList.add('hidden');
      if (img) {
        img.src = dataUri;
        img.classList.remove('hidden');
      }
    })
    .withFailureHandler(function(err) {
      if (spinner) {
        spinner.textContent = 'Failed to load photo: ' + (err.message || err);
        spinner.style.color = '#FCA5A5';
      }
    })
    .getSelfieBase64(imgUrlOrId);
}

function closePhotoModal() {
  var modal = document.getElementById('view-photo-modal');
  var img = document.getElementById('photo-modal-img');
  if (modal) modal.classList.add('hidden');
  if (img) {
    img.src = '';
    img.classList.add('hidden');
  }
}

/**
 * Dual Shift Photos Modal (Side-by-side Check-In and Check-Out)
 */
function openDualPhotoModal(inDriveUrl, outDriveUrl, title, inTime, outTime) {
  var modal = document.getElementById('modal-dual-photos');
  var titleEl = document.getElementById('dual-photo-modal-title');
  var inTimeEl = document.getElementById('dual-in-time');
  var outTimeEl = document.getElementById('dual-out-time');
  var inSpinner = document.getElementById('dual-in-spinner');
  var outSpinner = document.getElementById('dual-out-spinner');
  var inImg = document.getElementById('dual-in-img');
  var outImg = document.getElementById('dual-out-img');

  if (titleEl) titleEl.textContent = (title || 'Workday') + ' Photos';
  if (inTimeEl) inTimeEl.textContent = inTime || '--:--';
  if (outTimeEl) outTimeEl.textContent = outTime || '--:--';

  if (inImg) { inImg.src = ''; inImg.classList.add('hidden'); }
  if (outImg) { outImg.src = ''; outImg.classList.add('hidden'); }
  if (inSpinner) { inSpinner.classList.remove('hidden'); inSpinner.textContent = 'Loading photo...'; }
  if (outSpinner) { outSpinner.classList.remove('hidden'); outSpinner.textContent = 'Loading photo...'; }

  if (modal) modal.classList.remove('hidden');

  if (inDriveUrl) {
    google.script.run
      .withSuccessHandler(function(dataUri) {
        if (inSpinner) inSpinner.classList.add('hidden');
        if (inImg) {
          inImg.src = dataUri;
          inImg.classList.remove('hidden');
        }
      })
      .withFailureHandler(function(err) {
        if (inSpinner) inSpinner.textContent = 'Failed: ' + (err.message || err);
      })
      .getSelfieBase64(inDriveUrl);
  } else {
    if (inSpinner) inSpinner.textContent = 'No Check-In photo';
  }

  if (outDriveUrl) {
    google.script.run
      .withSuccessHandler(function(dataUri) {
        if (outSpinner) outSpinner.classList.add('hidden');
        if (outImg) {
          outImg.src = dataUri;
          outImg.classList.remove('hidden');
        }
      })
      .withFailureHandler(function(err) {
        if (outSpinner) outSpinner.textContent = 'Failed: ' + (err.message || err);
      })
      .getSelfieBase64(outDriveUrl);
  } else {
    if (outSpinner) outSpinner.textContent = 'No Check-Out photo';
  }
}

function closeDualPhotoModal() {
  var modal = document.getElementById('modal-dual-photos');
  var inImg = document.getElementById('dual-in-img');
  var outImg = document.getElementById('dual-out-img');
  if (modal) modal.classList.add('hidden');
  if (inImg) { inImg.src = ''; inImg.classList.add('hidden'); }
  if (outImg) { outImg.src = ''; outImg.classList.add('hidden'); }
}
