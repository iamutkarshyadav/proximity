<style>
/* ==========================================================================
   PROXIMITY ENTERPRISE DESIGN SYSTEM
   Linear / Apple / Stripe Grade High-End Interface
   Zero AI Slop | Zero Blinking Lights | Zero Gimmicks | 100% Zero Emojis
   ========================================================================== */

:root {
  /* Surfaces & Canvas */
  --bg-app: #F8FAFC;
  --surface-card: #FFFFFF;
  --surface-subtle: #F1F5F9;
  --surface-hover: #F8FAFC;

  /* Inks & Text */
  --text-primary: #0F172A;
  --text-secondary: #475569;
  --text-muted: #94A3B8;

  /* Hairline Borders */
  --border-subtle: #E2E8F0;
  --border-medium: #CBD5E1;
  --border-strong: #0F172A;

  /* Restrained Enterprise Accents */
  --accent-primary: #0F172A;
  --accent-primary-hover: #1E293B;
  --accent-photo: #0284C7;
  --accent-photo-hover: #0369A1;
  --accent-emerald: #059669;
  --accent-emerald-subtle: #ECFDF5;
  --accent-rose: #DC2626;
  --accent-rose-subtle: #FEF2F2;
  --accent-amber: #D97706;
  --accent-amber-subtle: #FFFBEB;

  /* Precision Typography */
  --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;

  /* Refined Elevation & Geometry */
  --radius-card: 12px;
  --radius-btn: 8px;
  --radius-pill: 9999px;

  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.05);

  --ease-tactile: cubic-bezier(0.16, 1, 0.3, 1);
}

/* Global Resets & Anti-Overflow */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  overflow-x: clip;
  max-width: 100vw;
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-sans);
  background-color: var(--bg-app);
  color: var(--text-primary);
  min-height: 100vh;
  padding: 0.75rem;
  padding-bottom: 2.5rem;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

@media (min-width: 768px) {
  body {
    padding: 1.25rem 2rem;
    padding-bottom: 3.5rem;
  }
}

/* App Container */
.app-container {
  max-width: 520px;
  margin: 0 auto;
  width: 100%;
  box-sizing: border-box;
  transition: max-width 0.25s var(--ease-tactile);
}

.app-container.admin-mode {
  max-width: 1200px;
}

/* ==========================================================================
   TOP APPLICATION BAR (Frosted Glass Header)
   ========================================================================== */
.top-bar {
  position: -webkit-sticky;
  position: sticky;
  top: 0.5rem;
  z-index: 1000;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-sm);
  padding: 0.65rem 0.95rem;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  box-sizing: border-box;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

@media (min-width: 768px) {
  .top-bar {
    top: 0.75rem;
    padding: 0.75rem 1.25rem;
    margin-bottom: 1.25rem;
  }
}

.top-bar-left {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  min-width: 0;
  flex: 1;
}

.brand-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  background: #0F172A;
  padding: 0.25rem 0.65rem;
  border-radius: var(--radius-btn);
  flex-shrink: 0;
}

.app-brand-name {
  font-family: var(--font-sans);
  font-size: 0.82rem;
  font-weight: 800;
  color: #FFFFFF;
  letter-spacing: 0.06em;
  line-height: 1;
}

.top-bar-sub {
  font-size: 0.76rem;
  color: var(--text-secondary);
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 0.45rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.header-context-badge {
  font-weight: 700;
  color: var(--text-primary);
  max-width: 140px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: inline-block;
  vertical-align: middle;
}

@media (min-width: 500px) {
  .header-context-badge {
    max-width: 240px;
  }
}

@media (min-width: 768px) {
  .header-context-badge {
    max-width: 380px;
  }
}

.header-dot-sep {
  color: var(--border-medium);
  font-weight: 600;
}

#header-live-clock {
  font-family: var(--font-mono);
  font-size: 0.74rem;
  font-weight: 600;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.top-bar-right {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-shrink: 0;
}

#header-user-email {
  display: inline-block;
  max-width: 130px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  vertical-align: middle;
  font-size: 0.74rem;
  color: var(--text-secondary);
}

@media (min-width: 500px) {
  #header-user-email {
    max-width: 220px;
  }
}

/* ==========================================================================
   CARDS & CONTAINERS
   ========================================================================== */
.ui-card {
  background: var(--surface-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-sm);
  padding: 1.25rem;
  margin-bottom: 1rem;
  width: 100%;
  box-sizing: border-box;
}

@media (min-width: 768px) {
  .admin-mode .ui-card {
    padding: 1.5rem;
    margin-bottom: 1.25rem;
  }
}

.card-header-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.5rem;
  margin-bottom: 0.85rem;
  width: 100%;
  box-sizing: border-box;
}

.card-header-left {
  min-width: 0;
  flex: 1;
}

.card-heading {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text-primary);
  word-break: break-word;
  overflow-wrap: anywhere;
  line-height: 1.25;
  letter-spacing: -0.01em;
}

.card-subheading {
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--text-secondary);
  margin-top: 0.2rem;
}

/* Desktop Split Layout */
.desktop-split-layout {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  width: 100%;
}

@media (min-width: 960px) {
  .admin-mode .desktop-split-layout {
    display: grid;
    grid-template-columns: 400px 1fr;
    gap: 1.25rem;
    align-items: start;
  }
}

/* ==========================================================================
   KPI SUMMARY GRID (Super Admin & Store Admin)
   ========================================================================== */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.65rem;
  margin-bottom: 1rem;
  width: 100%;
  box-sizing: border-box;
}

@media (min-width: 768px) {
  .admin-mode .kpi-grid {
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
    margin-bottom: 1.25rem;
  }
}

.kpi-card {
  background: var(--surface-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-sm);
  padding: 1rem 1.15rem;
  box-sizing: border-box;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.kpi-card:hover {
  border-color: var(--border-medium);
  box-shadow: var(--shadow-md);
}

.kpi-amber, .kpi-cyan, .kpi-purple, .kpi-mint {
  background: var(--surface-card);
}

.kpi-label {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.kpi-value {
  font-size: 1.75rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-top: 0.35rem;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}

@media (min-width: 768px) {
  .admin-mode .kpi-value {
    font-size: 2.1rem;
  }
}

/* ==========================================================================
   STORE ADMIN HEADER BANNER
   ========================================================================== */
.store-banner-card {
  background: var(--surface-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-sm);
  padding: 1.25rem 1.5rem;
  margin-bottom: 1rem;
  box-sizing: border-box;
}

@media (min-width: 768px) {
  .admin-mode .store-banner-card {
    padding: 1.5rem 1.75rem;
    margin-bottom: 1.25rem;
  }
}

.store-banner-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.5rem;
}

.badge-role-store {
  display: inline-block;
  font-size: 0.68rem;
  font-weight: 700;
  background: var(--surface-subtle);
  color: var(--text-secondary);
  border: 1px solid var(--border-subtle);
  padding: 0.15rem 0.5rem;
  border-radius: var(--radius-pill);
  letter-spacing: 0.04em;
  margin-bottom: 0.35rem;
}

.store-banner-title {
  font-size: 1.25rem;
  font-weight: 800;
  color: var(--text-primary);
  letter-spacing: -0.02em;
  word-break: break-word;
}

@media (min-width: 768px) {
  .admin-mode .store-banner-title {
    font-size: 1.5rem;
  }
}

.store-kpi-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.65rem;
  margin-top: 1rem;
}

@media (min-width: 768px) {
  .admin-mode .store-kpi-row {
    gap: 1rem;
  }
}

.store-kpi-tile {
  background: var(--surface-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-btn);
  padding: 0.85rem 1rem;
  box-shadow: var(--shadow-sm);
}

.store-kpi-label {
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.store-kpi-value {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-top: 0.2rem;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}

.text-green { color: var(--accent-emerald) !important; }
.text-orange { color: var(--accent-amber) !important; }
.text-red { color: var(--accent-rose) !important; }

/* ==========================================================================
   ADMIN NAVIGATION TABS (Segmented Controls)
   ========================================================================== */
.admin-tab-bar {
  display: flex;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-btn);
  padding: 3px;
  gap: 3px;
  margin-bottom: 1rem;
  width: 100%;
  box-sizing: border-box;
}

@media (min-width: 768px) {
  .admin-mode .admin-tab-bar {
    margin-bottom: 1.25rem;
  }
}

.admin-tab-btn {
  flex: 1;
  padding: 0.55rem 0.75rem;
  font-family: var(--font-sans);
  font-size: 0.84rem;
  font-weight: 600;
  color: var(--text-secondary);
  background: transparent;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
  text-align: center;
}

.admin-tab-btn:hover {
  color: var(--text-primary);
}

.admin-tab-btn.active {
  background: #FFFFFF;
  color: var(--text-primary);
  box-shadow: var(--shadow-sm);
  font-weight: 700;
}

.admin-filter-row {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  margin-bottom: 0.85rem;
}

@media (min-width: 768px) {
  .admin-mode .admin-filter-row {
    flex-direction: row;
    align-items: center;
  }
  .admin-mode .admin-filter-row > select {
    max-width: 260px;
  }
}

/* ==========================================================================
   STATUS BADGES (Clean, Static, Zero Blinking)
   ========================================================================== */
.badge-status {
  font-family: var(--font-sans);
  font-size: 0.72rem;
  font-weight: 600;
  padding: 0.2rem 0.6rem;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  white-space: nowrap;
  flex-shrink: 0;
  background: var(--surface-subtle);
  color: var(--text-secondary);
}

.badge-status.inside {
  background: var(--accent-emerald-subtle);
  color: #065F46;
  border-color: #A7F3D0;
}

.badge-status.outside {
  background: var(--surface-subtle);
  color: var(--text-secondary);
  border-color: var(--border-subtle);
}

.badge-status.checking {
  background: var(--surface-subtle);
  color: var(--text-secondary);
  border-color: var(--border-subtle);
}

.badge-status.error {
  background: var(--accent-rose-subtle);
  color: #991B1B;
  border-color: #FECACA;
}

/* Permanent elimination of blinking lights */

/* Role Badges */
.badge-role {
  font-size: 0.68rem;
  font-weight: 600;
  padding: 0.15rem 0.5rem;
  border-radius: 4px;
  border: 1px solid var(--border-subtle);
  display: inline-block;
  white-space: nowrap;
  background: var(--surface-subtle);
  color: var(--text-secondary);
}

.badge-role-super { background: #F1F5F9; color: #0F172A; }
.badge-role-mgr { background: #F1F5F9; color: #0F172A; }
.badge-role-user { background: #F8FAFC; color: #475569; }

/* ==========================================================================
   SEGMENTED PUNCH TOGGLE (In-Out Switcher)
   ========================================================================== */
.segmented-toggle {
  display: flex;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-btn);
  padding: 3px;
  margin-bottom: 0.85rem;
  gap: 3px;
  width: 100%;
  box-sizing: border-box;
}

.toggle-option {
  flex: 1;
  padding: 0.55rem 0.75rem;
  font-family: var(--font-sans);
  font-size: 0.86rem;
  font-weight: 600;
  color: var(--text-secondary);
  background: transparent;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s ease;
  text-align: center;
}

.toggle-option.active {
  background: #FFFFFF;
  color: var(--text-primary);
  box-shadow: var(--shadow-sm);
  font-weight: 700;
}

/* ==========================================================================
   CAMERA VIEWPORT
   ========================================================================== */
.camera-box {
  width: 100%;
  aspect-ratio: 4 / 3;
  max-height: 280px;
  background: #090D16;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-card);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 0.85rem;
  box-sizing: border-box;
}

.camera-box video, 
.camera-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.camera-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  color: #FFFFFF;
  text-align: center;
  padding: 1rem;
}

.camera-placeholder-text {
  font-size: 0.84rem;
  font-weight: 600;
  color: #94A3B8;
  letter-spacing: -0.01em;
}

/* ==========================================================================
   BUTTON HIERARCHY
   ========================================================================== */
.btn-photo {
  width: 100%;
  font-family: var(--font-sans);
  font-size: 0.92rem;
  font-weight: 600;
  padding: 0.72rem 1rem;
  background: var(--accent-photo);
  color: #FFFFFF;
  border: 1px solid #0369A1;
  border-radius: var(--radius-btn);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: background 0.15s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  margin-bottom: 0.75rem;
  box-sizing: border-box;
}

.btn-photo:hover {
  background: var(--accent-photo-hover);
}

.btn-proceed {
  width: 100%;
  font-family: var(--font-sans);
  font-size: 0.95rem;
  font-weight: 700;
  padding: 0.78rem 1rem;
  border-radius: var(--radius-btn);
  transition: all 0.15s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  box-sizing: border-box;
}

.btn-proceed:disabled {
  background: var(--surface-subtle);
  color: var(--text-muted);
  border: 1px solid var(--border-subtle);
  box-shadow: none;
  cursor: not-allowed;
}

.btn-proceed.ready {
  background: var(--accent-emerald);
  color: #FFFFFF;
  border: 1px solid #047857;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
}

.btn-proceed.ready:hover {
  background: #047857;
}

.btn-primary {
  width: 100%;
  font-family: var(--font-sans);
  font-size: 0.9rem;
  font-weight: 600;
  padding: 0.65rem 1rem;
  background: var(--accent-primary);
  color: #FFFFFF;
  border: 1px solid var(--accent-primary);
  border-radius: var(--radius-btn);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: background 0.15s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  box-sizing: border-box;
}

.btn-primary:hover {
  background: var(--accent-primary-hover);
}

.btn-secondary {
  font-family: var(--font-sans);
  font-size: 0.8rem;
  font-weight: 600;
  padding: 0.42rem 0.8rem;
  background: #FFFFFF;
  color: var(--text-primary);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-btn);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: all 0.12s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.35rem;
}

.btn-secondary:hover {
  background: var(--surface-subtle);
  border-color: var(--border-medium);
}

.btn-danger {
  font-family: var(--font-sans);
  font-size: 0.76rem;
  font-weight: 600;
  padding: 0.3rem 0.65rem;
  background: var(--accent-rose-subtle);
  color: var(--accent-rose);
  border: 1px solid #FECACA;
  border-radius: var(--radius-btn);
  cursor: pointer;
}

.btn-danger:hover {
  background: #FEE2E2;
}

.btn-sm {
  font-size: 0.76rem;
  padding: 0.3rem 0.65rem;
}

.btn-xs {
  font-size: 0.72rem;
  padding: 0.22rem 0.5rem;
}

/* ==========================================================================
   INPUTS & FORMS
   ========================================================================== */
.ui-label {
  display: block;
  font-size: 0.74rem;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 0.3rem;
  letter-spacing: 0.02em;
}

.ui-input, .ui-select {
  width: 100%;
  font-family: var(--font-sans);
  font-size: 0.88rem;
  padding: 0.58rem 0.75rem;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-btn);
  background: #FFFFFF;
  color: var(--text-primary);
  box-shadow: var(--shadow-sm);
  outline: none;
  box-sizing: border-box;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.ui-input:focus, .ui-select:focus {
  border-color: var(--border-strong);
  box-shadow: 0 0 0 2px rgba(15, 23, 42, 0.08);
}

.ui-select-sm {
  font-size: 0.78rem;
  padding: 0.35rem 0.6rem;
}

/* ==========================================================================
   CARD LISTS & ACTIVITY ITEMS
   ========================================================================== */
.card-list {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  width: 100%;
  box-sizing: border-box;
}

@media (min-width: 768px) {
  .admin-mode .card-list.grid-responsive {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 0.85rem;
  }
}

.activity-card-item {
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-btn);
  padding: 0.85rem 1rem;
  box-shadow: var(--shadow-sm);
  box-sizing: border-box;
  width: 100%;
  background: #FFFFFF;
  transition: border-color 0.15s ease;
}

.activity-card-item:hover {
  border-color: var(--border-medium);
}

.activity-row-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  margin-bottom: 0.35rem;
  width: 100%;
  box-sizing: border-box;
}

.activity-store-name {
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
  flex: 1;
}

.activity-row-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  width: 100%;
