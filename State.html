<script>
/**
 * State.html
 * Centralized Reactive State Store & Dispatcher
 * Multi-Store Attendance Platform
 */

window.AppState = (function() {
  const state = {
    // Session & User
    isInitialized: false,
    isRegistered: false,
    currentUser: null,
    currentRole: 'USER', // 'USER' | 'STORE_ADMIN' | 'SUPER_ADMIN'
    activeTab: 'punch',  // 'punch' | 'team' | 'manage'
    
    // Stores
    stores: [],
    allStores: [],       // Super Admin global stores
    assignedStore: null, // Hard-locked store for USER and STORE_ADMIN
    selectedStoreId: null,

    // Geolocation & Device
    geo: {
      lat: null,
      lng: null,
      accuracy: null,
      distance: null,
      isInside: false,
      status: 'INITIALIZING', // 'INITIALIZING' | 'LOCKING' | 'IN_BOUNDS' | 'OUT_BOUNDS' | 'ERROR'
      deviceType: 'MOBILE',   // 'MOBILE' | 'LAPTOP'
      lastUpdate: null,
      errorMessage: null
    },

    // Camera & Photo Verification
    camera: {
      isStreaming: false,
      facingMode: 'user',
      capturedBase64: null,
      watermarkedDataUrl: null,
      isCapturing: false
    },

    // Attendance History & Submission
    recentLogs: [],
    isSubmitting: false,

    // Scoped Team & Admin Data
    teamData: {
      team: [],
      logs: [],
      filterStoreId: 'ALL',
      isLoading: false
    }
  };

  const listeners = [];

  function getState() {
    return state;
  }

  function setState(updater) {
    if (typeof updater === 'function') {
      updater(state);
    } else if (typeof updater === 'object') {
      Object.assign(state, updater);
    }
    notify();
  }

  function subscribe(listener) {
    listeners.push(listener);
    return function unsubscribe() {
      const idx = listeners.indexOf(listener);
      if (idx > -1) listeners.splice(idx, 1);
    };
  }

  function notify() {
    for (let i = 0; i < listeners.length; i++) {
      try {
        listeners[i](state);
      } catch (err) {
        console.error("State listener error:", err);
      }
    }
  }

  function getSelectedStore() {
    if (state.autoCapturedStore) {
      return state.autoCapturedStore;
    }
    if (state.selectedStoreId && state.stores.length) {
      const found = state.stores.find(function(s) {
        return String(s.storeId) === String(state.selectedStoreId);
      });
      if (found) return found;
    }
    return state.stores[0] || null;
  }

  // Backward compatibility alias for GeoTracker and legacy callers
  function getSelectedHub() {
    const s = getSelectedStore();
    if (!s) return null;
    return {
      hubId: s.storeId,
      hubName: s.storeName,
      storeId: s.storeId,
      storeName: s.storeName,
      latitude: s.latitude,
      longitude: s.longitude,
      radiusMeters: s.radiusMeters
    };
  }

  return {
    getState: getState,
    setState: setState,
    subscribe: subscribe,
    getSelectedStore: getSelectedStore,
    getSelectedHub: getSelectedHub
  };
})();
</script>
